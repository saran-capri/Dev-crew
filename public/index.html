<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Crew</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M9 11l5 5-5 5M16 21h7' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu">☰</button>
    <a class="brand" href="#/office">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 11l5 5-5 5M16 21h7" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Dev Crew
    </a>
    <div class="people-search">
      <input type="search" id="peopleQ" placeholder="Who should I ask? e.g. backend questions in Inventory Service" aria-label="Who should I ask?" autocomplete="off">
      <div class="people-pop" id="peoplePop" hidden></div>
    </div>
    <div class="top-stats" id="topStats"></div>
    <div class="top-actions">
      <button class="btn" id="standupAllBtn" title="Write a stand-up for every project now">Run all stand-ups</button>
      <button class="btn primary" id="assignBtn">+ Assign task</button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">◐</button>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"><div class="empty">Loading…</div></main>
  </div>

  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="scrim" id="scrim"></div>

  <dialog class="modal" id="assignDlg"></dialog>
  <div class="toast" id="toast" role="status"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
